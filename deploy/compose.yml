# The whole Atlas stack. From this folder, with .env filled in (see SETUP.md):
#
#   docker compose up -d --build
#
# Each app runs inside the network of a small Tailscale container (its
# "sidecar"), which joins your tailnet under the app's name and serves it at
# https://<app>.<your tailnet>.ts.net with a certificate it gets itself.
# Nothing is published on your computer's own network or the internet.
#
# The apps listen on 127.0.0.2, not 127.0.0.1. The sidecars run Tailscale in
# userspace, which hands any other tailnet connection to the same port on
# 127.0.0.1; with nothing listening there, the only way in is Serve, which
# tells the app who you are and drops any such header a client makes up.

name: atlas

# One sidecar's settings; each app's sidecar adds its name and state volume.
x-sidecar: &sidecar
  image: tailscale/tailscale:v1.104.4
  restart: unless-stopped
  environment:
    TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env (see SETUP.md)}
    # Tagged devices don't expire every 180 days the way your own do.
    TS_EXTRA_ARGS: --advertise-tags=tag:atlas
    TS_STATE_DIR: /var/lib/tailscale
    TS_SERVE_CONFIG: /config/serve.json
    # No kernel network device needed: works the same on Docker Desktop.
    TS_USERSPACE: "true"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kairos
    volumes:
      # Postgres 18+ keeps its data in a versioned folder, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Atlas: the launcher -------------------------------------------------

  atlas-tailscale:
    <<: *sidecar
    hostname: atlas
    volumes:
      - tailscale-atlas:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  atlas:
    build:
      context: ..
      dockerfile: apps/atlas/Dockerfile
    image: atlas-launcher:local
    restart: unless-stopped
    network_mode: service:atlas-tailscale
    depends_on: [atlas-tailscale]
    environment:
      ATLAS_OWNER: ${ATLAS_OWNER:?Set ATLAS_OWNER in .env to your Tailscale login}
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in .env to your tailnet's name, e.g. tail1234.ts.net}
      ATLAS_APPS: ${ATLAS_APPS:-atlas,kairos,hestia,milo,hygeia}
      ATLAS_LOCALE: ${ATLAS_LOCALE:-en-US}
      TZ: ${TZ:-UTC}
      HOSTNAME: 127.0.0.2

  # --- Kairos: Dossier with Atlas's small patch (apps/kairos/ATLAS.md) -------

  kairos-tailscale:
    <<: *sidecar
    hostname: kairos
    volumes:
      - tailscale-kairos:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    # Lets Kairos reach Ollama or LM Studio running on this computer at
    # http://host.docker.internal:11434 (or :1234). Set on the sidecar,
    # because Kairos uses its network.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kairos:
    build:
      # Dossier's own Dockerfile, on the copy in apps/kairos.
      context: ../apps/kairos
      target: production
    image: atlas-kairos:local
    restart: unless-stopped
    network_mode: service:kairos-tailscale
    depends_on:
      kairos-tailscale:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@db:5432/kairos
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set DOSSIER_PASSWORD in .env (see SETUP.md)}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set DOSSIER_SECRET in .env}
      DOSSIER_PUBLIC_URL: https://kairos.${ATLAS_DOMAIN}
      DOSSIER_TELEMETRY: ${DOSSIER_TELEMETRY:-}
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_AI_KEY: ${DOSSIER_AI_KEY:-}
      # Dossier's own nightly export runs at 03:00 here, if the computer is on then.
      TZ: ${TZ:-UTC}
      # Signs you in through Tailscale, like the other apps: Dossier's
      # password is then only asked for if ATLAS_OWNER is removed.
      ATLAS_OWNER: ${ATLAS_OWNER}
      ATLAS_DOMAIN: ${ATLAS_DOMAIN}
      ATLAS_APPS: ${ATLAS_APPS:-atlas,kairos,hestia,milo,hygeia}
      # Only Serve reaches it here (see the top of this file); its PDF printer
      # opens this address too.
      HOSTNAME: 127.0.0.2
    healthcheck:
      # Dossier's own check asks 127.0.0.1, where Kairos no longer listens.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.2:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - kairos-data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g

  # --- Hestia: the house, on micasa's engine --------------------------------

  hestia-tailscale:
    <<: *sidecar
    hostname: hestia
    volumes:
      - tailscale-hestia:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  hestia:
    build:
      context: ..
      dockerfile: apps/hestia/Dockerfile
    image: atlas-hestia:local
    restart: unless-stopped
    network_mode: service:hestia-tailscale
    depends_on: [hestia-tailscale]
    environment:
      ATLAS_OWNER: ${ATLAS_OWNER}
      ATLAS_DOMAIN: ${ATLAS_DOMAIN}
      ATLAS_APPS: ${ATLAS_APPS:-atlas,kairos,hestia,milo,hygeia}
      ATLAS_LOCALE: ${ATLAS_LOCALE:-en-US}
      # The currency micasa saves in its database the first time; after that
      # its database decides, so set it before the first start.
      MICASA_LOCALE_CURRENCY: ${ATLAS_CURRENCY:-USD}
      TZ: ${TZ:-UTC}
      HOSTNAME: 127.0.0.2
    volumes:
      # micasa's database: everything Hestia knows about the house.
      - hestia-data:/data

  # --- Milo: the gym, working offline on the phone ---------------------------

  milo-tailscale:
    <<: *sidecar
    hostname: milo
    volumes:
      - tailscale-milo:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  milo:
    build:
      context: ..
      dockerfile: apps/milo/Dockerfile
    image: atlas-milo:local
    restart: unless-stopped
    network_mode: service:milo-tailscale
    depends_on:
      milo-tailscale:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      # Everything your devices sync, in the "milo" database.
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@db:5432/milo
      ATLAS_OWNER: ${ATLAS_OWNER}
      ATLAS_DOMAIN: ${ATLAS_DOMAIN}
      ATLAS_APPS: ${ATLAS_APPS:-atlas,kairos,hestia,milo,hygeia}
      ATLAS_LOCALE: ${ATLAS_LOCALE:-en-US}
      TZ: ${TZ:-UTC}
      HOSTNAME: 127.0.0.2

  # --- Hygeia: health, working offline on the phone -------------------------

  hygeia-tailscale:
    <<: *sidecar
    hostname: hygeia
    volumes:
      - tailscale-hygeia:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  hygeia:
    build:
      context: ..
      dockerfile: apps/hygeia/Dockerfile
    image: atlas-hygeia:local
    restart: unless-stopped
    network_mode: service:hygeia-tailscale
    depends_on:
      hygeia-tailscale:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      # Everything your devices sync, in the "hygeia" database; also the
      # calendar feed your phone subscribes to for reminders.
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@db:5432/hygeia
      ATLAS_OWNER: ${ATLAS_OWNER}
      ATLAS_DOMAIN: ${ATLAS_DOMAIN}
      ATLAS_APPS: ${ATLAS_APPS:-atlas,kairos,hestia,milo,hygeia}
      ATLAS_LOCALE: ${ATLAS_LOCALE:-en-US}
      TZ: ${TZ:-UTC}
      HOSTNAME: 127.0.0.2

  # --- Backups: everything, locked, to a folder you choose -----------------

  backup:
    build: ./backup
    image: atlas-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ATLAS_BACKUP_PASSPHRASE: ${ATLAS_BACKUP_PASSPHRASE:?Set ATLAS_BACKUP_PASSPHRASE in .env (see SETUP.md)}
      ATLAS_BACKUP_EVERY_HOURS: ${ATLAS_BACKUP_EVERY_HOURS:-24}
      ATLAS_BACKUP_KEEP_DAYS: ${ATLAS_BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-UTC}
    volumes:
      # Where the archives go: an external drive or a cloud-synced folder.
      - ${ATLAS_BACKUP_DIR:-./backups}:/backups
      # Hestia's house, copied with SQLite's own backup while Hestia runs.
      - hestia-data:/hestia
      # Your settings, kept in each archive: without DOSSIER_SECRET, the keys
      # Kairos stores can't be read back.
      - type: bind
        source: ./.env
        target: /config/env
        read_only: true
        bind:
          create_host_path: false

volumes:
  pgdata:
  kairos-data:
  hestia-data:
  # Each sidecar's identity on your tailnet. Keep these when moving to another
  # computer, and the addresses stay the same.
  tailscale-atlas:
  tailscale-kairos:
  tailscale-hestia:
  tailscale-milo:
  tailscale-hygeia:
